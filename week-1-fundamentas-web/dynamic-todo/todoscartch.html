<html>
    <body>
        <input type="text" placeholder="write here"></input>
        <button onclick="addtodo()">Addd task</button>
        
    </body>
    <script>
        let ctr=1;
            function addtodo(){
                const inpel=document.querySelector("input");
                const val=inpel.value;
                const newdiv=document.createElement("div");
                newdiv.setAttribute("id",ctr);
                newdiv.innerHTML='<div style="display: flex;">'+ '<div>' + ctr+"."+val +' </div>' + '<button onclick="deletetodo('+ctr+')">delete task</button>' + '</div>';
                document.querySelector("body").appendChild(newdiv);
                ctr=ctr+1;
                inpel.value=" ";
            }
            function deletetodo(index){
                 const ele=document.getElementById(index);
                 ele.parentNode.removeChild(ele);

            }
        </script>

</html>
